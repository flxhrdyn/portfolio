<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 750" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .sans-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', sans-serif; font-weight: 800; }
      .sans-medium { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', sans-serif; font-weight: 500; }
      .mono-bold { font-family: 'SF Mono', 'Geist Mono', 'Cascadia Code', 'Fira Code', monospace; font-weight: 700; }
      .mono-reg { font-family: 'SF Mono', 'Geist Mono', 'Cascadia Code', 'Fira Code', monospace; font-weight: 500; }
      .chip-bg { fill: #11141c; stroke: #222632; stroke-width: 1; rx: 6px; }
      .chip-text { font-family: 'SF Mono', 'Geist Mono', monospace; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .subtle-line { stroke: #222632; stroke-width: 1; }
    </style>
  </defs>

  <!-- 1. TOP HEADER -->
  <g transform="translate(0, 20)">
    <!-- Matrix Logo [::] flxhrdyn -->
    <g transform="translate(0, 0)">
      <path d="M4 2H1V18H4" stroke="#ffffff" stroke-width="1.8" stroke-linecap="square" />
      <path d="M16 2H19V18H16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="square" />
      <rect x="6" y="4" width="2" height="2" fill="#ffffff" />
      <rect x="9.5" y="4" width="2" height="2" fill="#ffffff" opacity="0.35" />
      <rect x="13" y="4" width="2" height="2" fill="#ffffff" />
      <rect x="6" y="8.5" width="2" height="2" fill="#ffffff" opacity="0.35" />
      <rect x="9.5" y="8.5" width="2" height="2" fill="#ffffff" />
      <rect x="13" y="8.5" width="2" height="2" fill="#ffffff" opacity="0.35" />
      <rect x="6" y="13" width="2" height="2" fill="#ffffff" />
      <rect x="9.5" y="13" width="2" height="2" fill="#ffffff" opacity="0.35" />
      <rect x="13" y="13" width="2" height="2" fill="#ffffff" />
      <text x="28" y="16" fill="#ffffff" font-size="18" class="sans-bold" letter-spacing="-0.035em">flxhrdyn</text>
    </g>

    <!-- Active Status Badge -->
    <g transform="translate(680, -4)">
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#11141c" stroke="#222632" stroke-width="1" />
      <circle cx="16" cy="13" r="3" fill="#ffffff" />
      <text x="28" y="17" fill="#d1d5db" font-size="9.5" class="mono-bold" letter-spacing="0.06em">ACTIVE // JAKARTA, ID</text>
    </g>
  </g>

  <!-- 2. HERO CONTENT -->
  <g transform="translate(0, 75)">
    <circle cx="3" cy="2" r="2.5" fill="#6b7280" />
    <text x="12" y="6" fill="#6b7280" font-size="10" class="mono-bold" letter-spacing="0.08em">AI ENGINEER &amp; DATA SCIENTIST</text>
    
    <text x="0" y="44" fill="#ffffff" font-size="34" class="sans-bold" letter-spacing="-0.04em">Felix Windriyareksa Hardyan</text>
    <text x="0" y="70" fill="#9ca3af" font-size="14.5" class="sans-medium" letter-spacing="-0.01em">Building production-grade AI systems, from Data Science to GenAI.</text>
  </g>

  <!-- 3. TELEMETRY STRIP -->
  <g transform="translate(0, 175)">
    <line x1="0" y1="0" x2="850" y2="0" class="subtle-line" />
    
    <!-- 2+ Yrs -->
    <g transform="translate(0, 16)">
      <text x="0" y="24" fill="#ffffff" font-size="26" class="mono-bold">2+ Yrs</text>
      <text x="0" y="42" fill="#9ca3af" font-size="9.5" class="mono-bold" letter-spacing="0.06em">AI/ML EXP</text>
    </g>

    <line x1="125" y1="16" x2="125" y2="58" class="subtle-line" />

    <!-- 10+ -->
    <g transform="translate(155, 16)">
      <text x="0" y="24" fill="#ffffff" font-size="26" class="mono-bold">10+</text>
      <text x="0" y="42" fill="#9ca3af" font-size="9.5" class="mono-bold" letter-spacing="0.06em">AI PROJECTS BUILT</text>
    </g>

    <line x1="330" y1="16" x2="330" y2="58" class="subtle-line" />

    <!-- BNSP -->
    <g transform="translate(360, 16)">
      <text x="0" y="24" fill="#ffffff" font-size="26" class="mono-bold">BNSP</text>
      <text x="0" y="42" fill="#9ca3af" font-size="9.5" class="mono-bold" letter-spacing="0.06em">CERTIFIED DATA SCIENTIST</text>
    </g>

    <!-- Domain -->
    <text x="850" y="44" text-anchor="end" fill="#ffffff" font-size="13" class="mono-bold" letter-spacing="-0.01em">flxhrdyn.vercel.app</text>

    <line x1="0" y1="72" x2="850" y2="72" class="subtle-line" />
  </g>

  <!-- 4. SECTION 01: ABOUT ME -->
  <g transform="translate(0, 280)">
    <!-- Header -->
    <circle cx="3" cy="2" r="3" fill="#ffffff" />
    <text x="14" y="6" fill="#d1d5db" font-size="11" class="mono-bold" letter-spacing="0.08em">01 // ABOUT ME</text>
    <text x="850" y="6" text-anchor="end" fill="#6b7280" font-size="10" class="mono-bold">SYS_PROFILE.MD</text>

    <!-- Text -->
    <g transform="translate(0, 22)">
      <text x="0" y="14" fill="#9ca3af" font-size="13.5" class="sans-medium" letter-spacing="-0.01em">
        I'm an <tspan fill="#ffffff" font-weight="700">AI Engineer</tspan> focused on architecting production-ready Machine Learning and Deep Learning systems.
      </text>
      <text x="0" y="36" fill="#9ca3af" font-size="13.5" class="sans-medium" letter-spacing="-0.01em">
        My experience spans building <tspan fill="#ffffff" font-weight="700">Agentic AI workflows, Advanced RAG pipelines</tspan>, fine-tuning LLMs (PEFT/QLoRA),
      </text>
      <text x="0" y="58" fill="#9ca3af" font-size="13.5" class="sans-medium" letter-spacing="-0.01em">
        and real-time Computer Vision models using YOLO. I bridge complex algorithms with real-world business requirements,
      </text>
      <text x="0" y="80" fill="#9ca3af" font-size="13.5" class="sans-medium" letter-spacing="-0.01em">
        from model experimentation through to production deployment on Docker and Azure.
      </text>
      <text x="0" y="112" fill="#9ca3af" font-size="13.5" class="sans-medium" letter-spacing="-0.01em">
        Beyond building systems, I've mentored <tspan fill="#ffffff" font-weight="700">100+ learners</tspan> through end-to-end Data Science programs and delivered
      </text>
      <text x="0" y="134" fill="#9ca3af" font-size="13.5" class="sans-medium" letter-spacing="-0.01em">
        technical AI training to an international academic audience.
      </text>
    </g>

    <!-- Exploring tags -->
    <g transform="translate(0, 185)">
      <text x="0" y="14" fill="#6b7280" font-size="10" class="mono-bold" letter-spacing="0.05em">CURRENTLY EXPLORING:</text>
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="84" height="22" class="chip-bg" />
        <text x="10" y="15" fill="#d1d5db" font-size="10" class="mono-bold">Agentic AI</text>

        <rect x="92" y="0" width="102" height="22" class="chip-bg" />
        <text x="102" y="15" fill="#d1d5db" font-size="10" class="mono-bold">Advanced RAG</text>

        <rect x="202" y="0" width="105" height="22" class="chip-bg" />
        <text x="212" y="15" fill="#d1d5db" font-size="10" class="mono-bold">Generative AI</text>

        <rect x="315" y="0" width="115" height="22" class="chip-bg" />
        <text x="325" y="15" fill="#d1d5db" font-size="10" class="mono-bold">LLM Fine-Tuning</text>
      </g>
    </g>
  </g>

  <!-- 5. SECTION 02: TECH STACK & CAPABILITIES -->
  <g transform="translate(0, 520)">
    <line x1="0" y1="0" x2="850" y2="0" class="subtle-line" />
    
    <!-- Header -->
    <g transform="translate(0, 20)">
      <circle cx="3" cy="2" r="3" fill="#ffffff" />
      <text x="14" y="6" fill="#d1d5db" font-size="11" class="mono-bold" letter-spacing="0.08em">02 // TECH STACK &amp; CAPABILITIES</text>
      <text x="850" y="6" text-anchor="end" fill="#6b7280" font-size="10" class="mono-bold">MATRIX_SKILLS.SYS</text>
    </g>

    <!-- Category 1: AI & ML -->
    <g transform="translate(0, 48)">
      <text x="0" y="18" fill="#6b7280" font-size="9.5" class="mono-bold" letter-spacing="0.05em">AI &amp; MACHINE LEARNING</text>
      <g transform="translate(150, 0)">
        <!-- PyTorch -->
        <rect x="0" y="0" width="82" height="26" class="chip-bg" />
        <text x="12" y="17" class="chip-text">PyTorch</text>
        <!-- TensorFlow -->
        <rect x="90" y="0" width="102" height="26" class="chip-bg" />
        <text x="102" y="17" class="chip-text">TensorFlow</text>
        <!-- Keras -->
        <rect x="200" y="0" width="70" height="26" class="chip-bg" />
        <text x="212" y="17" class="chip-text">Keras</text>
        <!-- Scikit-Learn -->
        <rect x="278" y="0" width="106" height="26" class="chip-bg" />
        <text x="290" y="17" class="chip-text">Scikit-Learn</text>
        <!-- OpenCV -->
        <rect x="392" y="0" width="80" height="26" class="chip-bg" />
        <text x="404" y="17" class="chip-text">OpenCV</text>
        <!-- YOLO -->
        <rect x="480" y="0" width="128" height="26" class="chip-bg" />
        <text x="492" y="17" class="chip-text">YOLO / Ultralytics</text>
      </g>
      <g transform="translate(150, 32)">
        <!-- LangChain -->
        <rect x="0" y="0" width="94" height="26" class="chip-bg" />
        <text x="12" y="17" class="chip-text">LangChain</text>
        <!-- Hugging Face -->
        <rect x="102" y="0" width="112" height="26" class="chip-bg" />
        <text x="114" y="17" class="chip-text">Hugging Face</text>
        <!-- MediaPipe -->
        <rect x="222" y="0" width="94" height="26" class="chip-bg" />
        <text x="234" y="17" class="chip-text">MediaPipe</text>
      </g>
    </g>

    <!-- Category 2: Languages & Data -->
    <g transform="translate(0, 126)">
      <text x="0" y="18" fill="#6b7280" font-size="9.5" class="mono-bold" letter-spacing="0.05em">LANGUAGES &amp; DATA</text>
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="76" height="26" class="chip-bg" />
        <text x="12" y="17" class="chip-text">Python</text>

        <rect x="84" y="0" width="138" height="26" class="chip-bg" />
        <text x="96" y="17" class="chip-text">SQL / PostgreSQL</text>

        <rect x="230" y="0" width="98" height="26" class="chip-bg" />
        <text x="242" y="17" class="chip-text">JavaScript</text>

        <rect x="336" y="0" width="78" height="26" class="chip-bg" />
        <text x="348" y="17" class="chip-text">Pandas</text>

        <rect x="422" y="0" width="76" height="26" class="chip-bg" />
        <text x="434" y="17" class="chip-text">NumPy</text>

        <rect x="506" y="0" width="130" height="26" class="chip-bg" />
        <text x="518" y="17" class="chip-text">Qdrant Vector DB</text>
      </g>
    </g>

    <!-- Category 3: MLOps & Deployment -->
    <g transform="translate(0, 172)">
      <text x="0" y="18" fill="#6b7280" font-size="9.5" class="mono-bold" letter-spacing="0.05em">MLOPS &amp; DEPLOYMENT</text>
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="80" height="26" class="chip-bg" />
        <text x="12" y="17" class="chip-text">FastAPI</text>

        <rect x="88" y="0" width="76" height="26" class="chip-bg" />
        <text x="100" y="17" class="chip-text">Docker</text>

        <rect x="172" y="0" width="128" height="26" class="chip-bg" />
        <text x="184" y="17" class="chip-text">Microsoft Azure</text>

        <rect x="308" y="0" width="90" height="26" class="chip-bg" />
        <text x="320" y="17" class="chip-text">Streamlit</text>

        <rect x="406" y="0" width="58" height="26" class="chip-bg" />
        <text x="418" y="17" class="chip-text">Git</text>

        <rect x="472" y="0" width="76" height="26" class="chip-bg" />
        <text x="484" y="17" class="chip-text">GitHub</text>
      </g>
    </g>
  </g>
</svg>
