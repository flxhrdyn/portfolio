<svg width="850" height="300" viewBox="0 0 850 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700;800&amp;family=Geist:wght@400;500;600;700;800&amp;display=swap');

      .bg-card { fill: #0b0c0e; stroke: #23262d; stroke-width: 1.5; rx: 12px; }
      .header-bar { fill: #12141a; stroke: #23262d; stroke-width: 1; }
      .col-box { fill: #12141a; stroke: #23262d; stroke-width: 1; rx: 8px; }
      .cat-title { font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 700; fill: #10b981; text-transform: uppercase; letter-spacing: 0.06em; }
      .skill-item { font-family: 'Geist', sans-serif; font-size: 12.5px; font-weight: 500; fill: #d1d5db; line-height: 1.6; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="846" height="296" rx="12" class="bg-card" />

  <!-- Window Header -->
  <path d="M 2 14 Q 2 2 14 2 L 836 2 Q 848 2 848 14 L 848 38 L 2 38 Z" class="header-bar" />
  <circle cx="20" cy="20" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="20" r="4.5" fill="#eab308" />
  <circle cx="48" cy="20" r="4.5" fill="#22c55e" />
  <text x="68" y="24" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#9ca3af">
    SECTION // <tspan fill="#ffffff">CAPABILITIES_MATRIX.SYS</tspan>
  </text>

  <!-- 3 Columns of Tech Stack -->
  <!-- Col 1: AI / ML Core -->
  <g transform="translate(32, 54)">
    <rect width="248" height="224" class="col-box" />
    <text x="20" y="28" class="cat-title">01 // AI &amp; MACHINE LEARNING</text>
    <text x="20" y="58" class="skill-item">&bull; PyTorch, TensorFlow, Keras</text>
    <text x="20" y="82" class="skill-item">&bull; Scikit-Learn, LightGBM</text>
    <text x="20" y="106" class="skill-item">&bull; OpenCV, MediaPipe, YOLO</text>
    <text x="20" y="130" class="skill-item">&bull; ConvNeXt, Grad-CAM</text>
    <text x="20" y="154" class="skill-item">&bull; Predictive Maintenance</text>
    <text x="20" y="178" class="skill-item">&bull; Signal Processing</text>
  </g>

  <!-- Col 2: GenAI & RAG -->
  <g transform="translate(301, 54)">
    <rect width="248" height="224" class="col-box" />
    <text x="20" y="28" class="cat-title">02 // GENAI &amp; AGENTIC SYSTEMS</text>
    <text x="20" y="58" class="skill-item">&bull; Hybrid RAG (Dense + Sparse)</text>
    <text x="20" y="82" class="skill-item">&bull; Qdrant Vector Database</text>
    <text x="20" y="106" class="skill-item">&bull; Pydantic AI, LangChain</text>
    <text x="20" y="130" class="skill-item">&bull; LLM Fine-Tuning (PEFT/QLoRA)</text>
    <text x="20" y="154" class="skill-item">&bull; FlashRank Rerankers</text>
    <text x="20" y="178" class="skill-item">&bull; Chain-of-Thought Workflows</text>
  </g>

  <!-- Col 3: Cloud & Backend -->
  <g transform="translate(570, 54)">
    <rect width="248" height="224" class="col-box" />
    <text x="20" y="28" class="cat-title">03 // CLOUD &amp; BACKEND</text>
    <text x="20" y="58" class="skill-item">&bull; Python, SQL, TypeScript</text>
    <text x="20" y="82" class="skill-item">&bull; FastAPI, Next.js 16, React 19</text>
    <text x="20" y="106" class="skill-item">&bull; Docker Containerization</text>
    <text x="20" y="130" class="skill-item">&bull; Microsoft Azure App Service</text>
    <text x="20" y="154" class="skill-item">&bull; NVIDIA DGX Systems</text>
    <text x="20" y="178" class="skill-item">&bull; Upstash Redis Caching</text>
  </g>
</svg>
